name: Android baseline (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build RecompCore Android debug APK
        working-directory: vendor/dolphin/Source/Android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          find vendor/dolphin/Source/Android/app/build/outputs/apk \
            -type f -name "*.apk" -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"

      - name: Upload Android baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: ModernGekko-Android-Baseline
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
