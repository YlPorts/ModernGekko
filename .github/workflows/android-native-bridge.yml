name: Android importer

on:
  workflow_dispatch:
  push:
    branches:
      - android-port
    paths:
      - ".github/workflows/android-native-bridge.yml"
      - "android/native/**"
      - "android/app/**"
      - "include/moderngekko/**"
      - "src/runtime/**"
      - "vendor/dolphin"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/android-native-bridge.yml"
      - "android/native/**"
      - "android/app/**"
      - "include/moderngekko/**"
      - "src/runtime/**"
      - "vendor/dolphin"

concurrency:
  group: android-port-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository and RecompCore
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1" \
            "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
          validate-wrappers: false

      - name: Configure standalone ARM64 inspector
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/29.0.14206865"
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" \
            -S android/native \
            -B build/android-native-arm64 \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build standalone ARM64 inspector
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" \
            --build build/android-native-arm64 \
            --target moderngekko_android \
            --parallel 2

      - name: Verify standalone native library
        shell: bash
        run: |
          test -f build/android-native-arm64/libmoderngekko_android.so
          file build/android-native-arm64/libmoderngekko_android.so
          readelf -h build/android-native-arm64/libmoderngekko_android.so | grep -q "AArch64"

      - name: Build Android game importer APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace -p android/app :app:assembleDebug

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p artifact/native/arm64-v8a artifact/apk
          cp build/android-native-arm64/libmoderngekko_android.so artifact/native/arm64-v8a/
          find android/app/app/build/outputs/apk/debug \
            -type f -name "*.apk" -exec cp {} artifact/apk/ModernGekko-Android-Importer-debug.apk \;
          test -f artifact/apk/ModernGekko-Android-Importer-debug.apk

      - name: Upload Android importer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ModernGekko-Android-Importer-arm64-v8a
          path: artifact
          if-no-files-found: error
          retention-days: 14
